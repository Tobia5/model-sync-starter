name: Model Sync default verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: model-sync-default-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Offline contracts and syntax
        run: |
          bash scripts/test-triggers.sh
          java scripts/SourceSyntaxCheck.java .
      - name: Default Maven contract
        id: build
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./mvnw -B -ntp clean verify 2>&1 | tee "$RUNNER_TEMP/model-sync-default.log"
          code=${PIPESTATUS[0]}
          python3 scripts/check-default-log.py "$RUNNER_TEMP/model-sync-default.log"
          audit=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$audit" -ne 0 ]; then exit "$audit"; fi
          exit "$code"
      - name: Record quality evidence
        if: always()
        shell: bash
        run: |
          mkdir -p target/qm
          if [ -f "$RUNNER_TEMP/model-sync-default.log" ]; then cp "$RUNNER_TEMP/model-sync-default.log" target/qm/default-build.log; fi
          status=NOT_RUN
          if [ '${{ steps.build.outcome }}' = success ]; then status=PASS; fi
          if [ '${{ steps.build.outcome }}' = failure ]; then status=FAILED; fi
          args=(--default-command './mvnw -B -ntp clean verify' --default-status "$status")
          if [ -n '${{ steps.build.outputs.exit }}' ]; then args+=(--default-exit '${{ steps.build.outputs.exit }}'); fi
          python3 scripts/qm-report.py "${args[@]}"
      - name: Upload run-scoped quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-sync-default-qm-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/qm/*
            **/target/surefire-reports/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve built jars for inspection
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-sync-jars-${{ github.sha }}-${{ github.run_attempt }}
          path: '**/target/*.jar'
          if-no-files-found: error
          retention-days: 14
